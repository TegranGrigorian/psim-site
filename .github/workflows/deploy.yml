name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:      # run by hand after pushing new data to the psim repo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out psim (data and docs)
        uses: actions/checkout@v4
        with:
          repository: TegranGrigorian/psim
          path: psim
      - name: Check out psim-site
        uses: actions/checkout@v4
        with:
          path: psim/psim-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: psim/psim-site/package-lock.json
      - run: npm ci
        working-directory: psim/psim-site
      - run: npm run build
        working-directory: psim/psim-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: psim/psim-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
