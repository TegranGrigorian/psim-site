server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # hashed build files never change, so they can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        location ~* \.mjs$ { default_type application/javascript; }
    }

    # data and docs change on every deploy
    location ~* \.(json|geojson|md)$ {
        add_header Cache-Control "no-cache";
        types { application/json json; application/geo+json geojson; text/markdown md; }
    }
}
